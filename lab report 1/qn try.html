<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लोक सेवा आयोग - दर्ता गर्नुहोस्</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 850px;
            padding: 30px;
            border-radius: 8px;
        }

        /* Header Setup */
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: auto;
        }

        .agency-title {
            font-size: 1.4rem;
            color: #1e293b;
        }

        .lang-selector select {
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .form-title {
            font-size: 1.6rem;
            color: #1e293b;
            margin-bottom: 20px;
        }

        /* 3-Column Layout Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        /* Special sizing for Gender and Email row */
        .gender-group {
            grid-column: span 1;
        }

        .email-group {
            grid-column: span 2;
        }

        /* Labels & Inputs */
        label {
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .required {
            color: #dc2626;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.95rem;
            height: 40px;
            outline: none;
        }

        /* Gray background for AD converted dates */
        .disabled-field input {
            background-color: #f1f5f9;
        }

        /* Calendar Wrapper */
        .input-wrapper {
            position: relative;
        }

        .calendar-icon {
            position: absolute;
            right: 10px;
            top: 10px;
            color: #64748b;
            pointer-events: none;
        }

        /* Radio Options horizontal row */
        .radio-options {
            display: flex;
            align-items: center;
            gap: 15px;
            height: 40px;
        }

        .radio-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        /* Bottom Buttons */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
        }

        .btn-back {
            padding: 10px 20px;
            border: 1px solid #2563eb;
            color: #2563eb;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn-submit {
            padding: 10px 30px;
            background-color: #1d63ed;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* Responsive Fix for small screens */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .gender-group, .email-group {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <header class="form-header">
            <div class="logo-title">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Emblem_of_Nepal.svg" alt="Nepal Emblem" class="logo">
                <h1 class="agency-title">लोक सेवा आयोग</h1>
            </div>
            <div class="lang-selector">
                <select>
                    <option>नेपा ▾</option>
                    <option>English</option>
                </select>
            </div>
        </header>

        <h2 class="form-title">दर्ता गर्नुहोस्</h2>

        <form>
            <div class="form-grid">
                
                <div class="form-group">
                    <label>पहिलो नाम <span class="required">*</span></label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>बीचको नाम</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>थर <span class="required">*</span></label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>प्रयोगकर्ता नाम <span class="required">*</span></label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>जन्म मिति (वि.सं.) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="YYYY-MM-DD" required>
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>
                <div class="form-group disabled-field">
                    <label>जन्म मिति (ई.सं.) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="YYYY-MM-DD" readonly>
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <div class="form-group gender-group">
                    <label>लिङ्ग <span class="required">*</span></label>
                    <div class="radio-options">
                        <label><input type="radio" name="gender" checked> पुरुष</label>
                        <label><input type="radio" name="gender"> महिला</label>
                        <label><input type="radio" name="gender"> अन्य</label>
                    </div>
                </div>
                <div class="form-group email-group">
                    <label>ईमेल <span class="required">*</span></label>
                    <input type="email" required>
                </div>

                <div class="form-group">
                    <label>मोबाइल नम्बर <span class="required">*</span></label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>राष्ट्रिय परिचय नम्बर</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>नागरिकता नम्बर <span class="required">*</span></label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>नागरिकता जारी जिल्ला <span class="required">*</span></label>
                    <select required>
                        <option value="">विकल्प छान्नुहोस् ...</option>
                        <option>काठमाडौं</option>
                        <option>ललितपुर</option>
                        <option>भक्तपुर</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>नागरिकता जारी मिति (वि.सं.) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="YYYY-MM-DD" required>
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>
                <div class="form-group disabled-field">
                    <label>नागरिकता जारी मिति (ई.सं.) <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="YYYY-MM-DD" readonly>
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <a href="#" class="btn-back">लग-इनमा फर्कनुहोस्</a>
                <button type="submit" class="btn-submit">बुझाउनुहोस्</button>
            </div>
        </form>
    </div>

</body>
</html>
