<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            gap:5px;
            padding:10px;
        }

        header,
        section,
        main,
        aside,
        footer{
            padding:30px;
            text-align:center;
            font-weight:bold;
        }

        header{
            width:100%;
            background:#ff8080;
        }

        section{
            width:100%;
            background:#f4d35e;
            order:2;
        }

        main{
            width:100%;
            background:#f5f5f5;
            order:1;
        }

        aside{
            width:100%;
            background:#b8e66b;
            order:3;
        }

        footer{
            width:100%;
            background:#66c2ff;
        }

        /* Tablet */
        @media(min-width:600px){

            main{
                width:100%;
            }

            section,
            aside{
                width:calc(50% - 3px);
            }
        }

        /* Desktop */
        @media(min-width:900px){

            section{
                width:25%;
                order:1;
            }

            main{
                width:48%;
                order:2;
            }

            aside{
                width:25%;
                order:3;
            }
        }
    </style>
</head>
<body>

    <header>Header</header>

    <div class="container">
        <section>Left</section>
        <main>Main</main>
        <aside>Right</aside>
    </div>

    <footer>Footer</footer>

</body>
</html>
